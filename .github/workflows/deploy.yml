name: deploy

# Runs after a PR merges to main. The "production" environment requires a
# human approval (set by scripts/setup-repo.sh) before anything reaches Azure.
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: production

jobs:
  deploy:
    name: deploy to Azure App Service
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      # KodeKloud's sandbox gives a service principal with a client secret and
      # does not allow federated credentials, so this uses a secret, not OIDC.
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy app/ (App Service builds requirements.txt on the server)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app

      - name: Smoke test
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz"
          for i in $(seq 1 30); do
            if curl -fsS "$URL"; then echo; echo "Healthy"; exit 0; fi
            sleep 10
          done
          echo "App did not become healthy in 5 minutes" >&2
          exit 1
